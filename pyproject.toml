[project]
name = "hsl-rt-analysis"
description = "Analysis toolkit for HSL High Frequency Positioning (HFP) data"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

dependencies = [
    # Sentry
    "sentry-sdk>=2.73.0",

    # Networking
    "paho-mqtt>=2.1.0",

    # Core data processing
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",

    # Time series analysis
    "statsmodels>=0.15.0",
    "dtaidistance>=2.5.1",  # For time series pattern matching

    # Machine Learning
    "scikit-learn>=1.9.1",

    # Visualization
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "plotly>=7.1.0",
    "dash>=4.4.1",  # Added for web dashboards
    "streamlit>=1.66.1",
    "watchdog>=6.0.0",

    # Geospatial analysis
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",  # Added for geometric operations

    # Data validation and processing
    # "great-expectations>=1.3.8",
    "pyarrow>=26.0.0",
    "tqdm>=4.70.1",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",  # For anomaly detection
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    "ruff>=0.17.3",
    "pre-commit>=4.7.0",
    # "jupyter",
    # "notebook",
]
docs = [
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
target-version = "py314"
exclude = ["docs/*.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ["hsl_rt_analysis"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=fvhdata --cov-report=term-missing"
